<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RippleReview · RippleEdit</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/icon-180.png">
  <meta name="theme-color" content="#050505">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- The site's tritone: footage mapped onto ember, signal and warm white. -->
  <svg class="filter-defs" aria-hidden="true" focusable="false">
    <filter id="tritone" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0
                                           0.2126 0.7152 0.0722 0 0
                                           0.2126 0.7152 0.0722 0 0
                                           0      0      0      1 0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.04 0.86 1"/>
        <feFuncG type="table" tableValues="0.03 0.26 0.93"/>
        <feFuncB type="table" tableValues="0.05 0.11 0.86"/>
      </feComponentTransfer>
    </filter>
  </svg>

  <div class="auth" data-auth hidden></div>

  <div class="app" data-shell hidden>
    <aside class="sidebar" data-sidebar aria-label="Navigation"></aside>
    <div class="sidebar-scrim" data-scrim hidden></div>

    <div class="app-main">
      <header class="app-bar">
        <button class="icon-button app-menu" type="button" data-menu-toggle aria-label="Menu">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <nav class="crumbs" data-crumbs aria-label="Breadcrumb"></nav>
        <div class="app-bar-actions">
          <button class="icon-button" type="button" data-refresh aria-label="Check Dropbox for new files" title="Check Dropbox for new files">
            <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-.6 4M20 5v6h-6"/></svg>
          </button>
        </div>
      </header>

      <main id="main" data-view></main>
    </div>
  </div>

  <div class="toast" data-toast role="status" aria-live="polite" hidden></div>
</body>
</html>

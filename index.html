<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RippleReview · RippleEdit</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&amp;family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <!-- The site's tritone: footage mapped onto ember, signal and warm white. -->
  <svg class="filter-defs" aria-hidden="true" focusable="false">
    <filter id="tritone" color-interpolation-filters="sRGB">
      <feColorMatrix type="matrix" values="0.2126 0.7152 0.0722 0 0
                                           0.2126 0.7152 0.0722 0 0
                                           0.2126 0.7152 0.0722 0 0
                                           0      0      0      1 0"/>
      <feComponentTransfer>
        <feFuncR type="table" tableValues="0.04 0.86 1"/>
        <feFuncG type="table" tableValues="0.03 0.26 0.93"/>
        <feFuncB type="table" tableValues="0.05 0.11 0.86"/>
      </feComponentTransfer>
    </filter>
  </svg>

  <header class="app-header" data-header hidden>
    <a class="brand" href="#/" aria-label="RippleReview, home">
      <img src="assets/logotype.png" width="132" height="30" alt="RippleEdit">
      <span class="brand-product">Review</span>
    </a>
    <nav class="app-nav" data-nav aria-label="Main"></nav>
    <div class="app-user">
      <span class="app-user-name" data-user-name></span>
      <button class="button button--ghost button--compact" type="button" data-sign-out>Sign out</button>
    </div>
  </header>

  <main id="main" data-view>
    <div class="boot" aria-live="polite"><span class="live-dot" aria-hidden="true"></span> Loading</div>
  </main>

  <div class="toast" data-toast role="status" aria-live="polite" hidden></div>
</body>
</html>
